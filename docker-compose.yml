services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: personal_trainer
      POSTGRES_USER: personal_trainer
      POSTGRES_PASSWORD: personal_trainer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_trainer -d personal_trainer"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://personal_trainer:personal_trainer@postgres:5432/personal_trainer?schema=public
      PORT: 3000
      JWT_SECRET: change-this-secret-in-production
      JWT_EXPIRES_IN: 1h
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data: